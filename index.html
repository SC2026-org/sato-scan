<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SATO Sport - Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: '#1E4D3E',
            mustard: '#ECB140',
            cream: '#F7F6F2'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; height: 100% !important; }
    #reader { border: none !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <div>

           class="text-white/90 text-lg leading-none p-1 active:scale-90 transition no-underline">
          ←

        <h1 class="text-white font-bold text-base">Scanner Petugas</h1>

      <!-- Card Form Melayang (-mt-5) -->
      <div class="px-4 -mt-5 pb-4">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex flex-col gap-3.5">

KNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAmKNYgJijWICYo1iAm/gXkL9162uF6kgAAAABJRU5ErkJggg==" alt="SATO" class="h-8 w-auto mb-1" />
            <p id="labelPetugas" class="text-[11px] text-gray-400">Petugas: Memuat...</p>
          </div>

          <!-- Dropdown Sesi (Grid 2 Kolom) -->
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[11px] font-semibold text-gray-500 mb-0.5 block">Cabang</label>
              <div class="relative">
                <select id="selectCabang" onchange="onCabangChange()"
                  class="w-full appearance-none px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-forest text-xs font-semibold text-gray-700 transition">
                  <option value="">Memuat cabang...</option>
                </select>
                <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]">▼</div>
              </div>
            </div>

            <div>
              <label class="text-[11px] font-semibold text-gray-500 mb-0.5 block">Olahraga</label>
              <div class="relative">
                <select id="selectOlahraga" disabled
                  class="w-full appearance-none px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-100 text-gray-400 focus:outline-none text-xs font-semibold transition">
                  <option value="">Pilih cabang dulu</option>
                </select>
                <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]">▼</div>
              </div>
            </div>
          </div>

          <!-- Tombol Kunci Sesi (Warna & Bentuk Sesuai Tombol Masuk Login) -->
          <button type="button" id="btnSimpanSesi" onclick="handleTombolSesi()"
            class="w-full bg-mustard text-forest font-bold text-sm py-3 rounded-xl shadow-sm active:scale-[0.98] transition flex items-center justify-center gap-2">
            <span id="iconBtnSesi">🔒</span>
            <span id="labelBtnSesi">Simpan &amp; Kunci Sesi</span>
          </button>

          <!-- Area Scanner & Manual Input (Terkunci sebelum sesi dipilih) -->
          <div id="areaAbsensi" class="opacity-30 pointer-events-none transition-all duration-300 flex flex-col gap-3 border-t border-dashed border-gray-200 pt-3">
            
            <!-- Area Kamera Scanner -->
            <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden flex items-center justify-center shadow-inner">
              <div id="reader" class="w-full h-full"></div>
              
              <!-- Overlay Kamera -->
              <div id="cameraPrompt" class="absolute inset-0 bg-gray-900/90 flex flex-col items-center justify-center p-4 text-center z-20">
                <span class="text-3xl mb-2">📷</span>
                <p class="text-white text-xs font-semibold mb-3">Ketuk tombol untuk menyalakan kamera</p>
                <button id="btnAktifkanKamera" onclick="requestCameraAccess()" 
                  class="bg-mustard text-forest font-bold text-xs px-5 py-2.5 rounded-xl shadow-md active:scale-95 transition">
                  Aktifkan Kamera
                </button>
              </div>

              <div id="scanOverlay" class="absolute inset-0 pointer-events-none border-2 border-mustard m-8 rounded-xl opacity-60 hidden"></div>
            </div>

            <!-- Status Box -->
            <div id="statusBox" class="min-h-[44px] bg-gray-50 border border-gray-100 rounded-xl p-2.5 flex items-center justify-center text-center">
              <p id="statusText" class="text-xs text-gray-400 font-medium">Pilih cabang & olahraga lalu klik Simpan Sesi</p>
            </div>

            <!-- Input Manual -->
            <div class="flex gap-2">
              <input type="text" id="inputManual" placeholder="Kode Manual (6 digit)"
                class="flex-1 px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-xs font-mono font-bold focus:outline-none focus:ring-1 focus:ring-forest" />
              <button onclick="prosesManual()" 
                class="bg-forest text-white px-4 py-2.5 rounded-lg text-xs font-bold active:scale-95 transition">
                Kirim
              </button>
            </div>

          </div>

        </div>

        <p class="text-center text-[11px] text-gray-400 mt-4 px-2 leading-relaxed">
          Sesi yang sudah dikunci akan otomatis tersimpan untuk scan absensi peserta berikutnya.
        </p>

    <!-- Footer -->
    <div class="pb-4 text-center">
      <p class="text-[10px] text-gray-400">SATO Sport &mdash; Powered On Site</p>
    </div>

  <script>
    var BACKEND_URL = "https://script.google.com/macros/s/AKfycbyOwR22_3brncTkrJcrGwxufbmlXg4QfScFP2n-QefL_umC38H5PmqAfgRnzjxBy3yP1g/exec";

    var LIVE_DATA_MASTER = {};
    var tokenPetugas = "";
    var namaPetugas = "";
    var html5QrCode = null;
    var isProcessing = false;
    var isSesiTerkunci = false;

    function parseHash() {
      try {
        var hash = window.location.hash.substring(1);
        var btnBack = document.getElementById('btnKembali');
        if (btnBack) btnBack.href = BACKEND_URL;

        if (!hash) return;
        var params = new URLSearchParams(hash);
        tokenPetugas = params.get('token') || '';
        namaPetugas = params.get('nama') || '';

        if (namaPetugas) {
          document.getElementById('labelPetugas').textContent = 'Petugas: ' + decodeURIComponent(namaPetugas);
        }
      } catch (e) {
        console.error("Gagal parse hash:", e);
      }
    }

    // Mengambil data Master_Olahraga dari spreadsheet via JSONP
    window.onMasterDataLoaded = function (res) {
      var selCabang = document.getElementById('selectCabang');
      if (!res || !res.success || !res.data) {
        selCabang.innerHTML = '<option value="">Gagal memuat cabang</option>';
        return;
      }

      LIVE_DATA_MASTER = res.data;
      selCabang.innerHTML = '<option value="">Pilih Cabang</option>';

      Object.keys(LIVE_DATA_MASTER).forEach(function (cabang) {
        var opt = document.createElement('option');
        opt.value = cabang;
        opt.textContent = cabang;
        selCabang.appendChild(opt);
      });

      var savedCabang = (localStorage.getItem('sato_scan_cabang') || '').trim();
      var savedOlahraga = (localStorage.getItem('sato_scan_olahraga') || '').trim();

      if (savedCabang && LIVE_DATA_MASTER[savedCabang]) {
        selCabang.value = savedCabang;
        renderOlahraga(savedCabang, savedOlahraga, true);
      }
    };

    function fetchMasterDataFromAPI() {
      var script = document.createElement('script');
      script.src = BACKEND_URL + "?action=getMasterOlahragaFull&callback=onMasterDataLoaded&_t=" + Date.now();
      script.onerror = function () {
        var selCabang = document.getElementById('selectCabang');
        selCabang.innerHTML = '<option value="">Gagal terhubung server</option>';
      };
      document.body.appendChild(script);
    }

    function onCabangChange() {
      var cabang = (document.getElementById('selectCabang').value || '').trim();
      renderOlahraga(cabang, null, false);
    }

    function renderOlahraga(cabang, autoSelectOlahraga, isAutoLock) {
      var selOlahraga = document.getElementById('selectOlahraga');
      if (!cabang || !LIVE_DATA_MASTER[cabang]) {
        selOlahraga.disabled = true;
        selOlahraga.className = 'w-full appearance-none px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-100 text-gray-400 focus:outline-none text-xs font-semibold transition';
        selOlahraga.innerHTML = '<option value="">Pilih cabang dulu</option>';
        return;
      }

      var list = LIVE_DATA_MASTER[cabang];
      selOlahraga.innerHTML = '<option value="">Pilih Olahraga</option>';

      list.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        selOlahraga.appendChild(opt);
      });

      selOlahraga.disabled = false;
      selOlahraga.className = 'w-full appearance-none px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-forest text-xs font-semibold text-gray-700 transition';

      if (autoSelectOlahraga && list.indexOf(autoSelectOlahraga) !== -1) {
        selOlahraga.value = autoSelectOlahraga;
        if (isAutoLock) kunciSesiUI(true);
      }
    }

    function validasiSesi(c, o) {
      var valC = String(c || '').trim().toLowerCase();
      var valO = String(o || '').trim().toLowerCase();
      if (!valC || valC.indexOf('pilih') !== -1 || valC.indexOf('memuat') !== -1) return false;
      if (!valO || valO.indexOf('pilih') !== -1 || valO.indexOf('memuat') !== -1) return false;
      return true;
    }

    function handleTombolSesi() {
      if (!isSesiTerkunci) {
        var c = document.getElementById('selectCabang').value;
        var o = document.getElementById('selectOlahraga').value;

        if (!validasiSesi(c, o)) {
          alert("Silakan pilih Cabang dan Olahraga terlebih dahulu!");
          return;
        }

        localStorage.setItem('sato_scan_cabang', c.trim());
        localStorage.setItem('sato_scan_olahraga', o.trim());
        kunciSesiUI(true);
      } else {
        kunciSesiUI(false);
      }
    }

    function kunciSesiUI(lock) {
      var selCabang = document.getElementById('selectCabang');
      var selOlahraga = document.getElementById('selectOlahraga');
      var btn = document.getElementById('btnSimpanSesi');
      var iconBtn = document.getElementById('iconBtnSesi');
      var labelBtn = document.getElementById('labelBtnSesi');
      var areaAbsensi = document.getElementById('areaAbsensi');

      if (lock) {
        if (!validasiSesi(selCabang.value, selOlahraga.value)) {
          kunciSesiUI(false);
          return;
        }

        isSesiTerkunci = true;
        selCabang.disabled = true;
        selOlahraga.disabled = true;
        selCabang.className = 'w-full appearance-none px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-100 text-gray-400 text-xs font-semibold';
        selOlahraga.className = 'w-full appearance-none px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-100 text-gray-400 text-xs font-semibold';

        btn.className = "w-full bg-white text-forest border border-forest font-bold text-sm py-3 rounded-xl shadow-sm flex items-center justify-center gap-2 active:scale-[0.98] transition";
        iconBtn.textContent = "✏️";
        labelBtn.textContent = "Ubah Sesi Olahraga";

        areaAbsensi.classList.remove('opacity-30', 'pointer-events-none');
        setStatus("Sesi aktif: " + selCabang.value + " (" + selOlahraga.value + ")", "normal");
      } else {
        isSesiTerkunci = false;
        selCabang.disabled = false;
        selOlahraga.disabled = false;
        selCabang.className = 'w-full appearance-none px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-forest text-xs font-semibold text-gray-700 transition';
        selOlahraga.className = 'w-full appearance-none px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-1 focus:ring-forest text-xs font-semibold text-gray-700 transition';

        btn.className = "w-full bg-mustard text-forest font-bold text-sm py-3 rounded-xl shadow-sm flex items-center justify-center gap-2 active:scale-[0.98] transition";
        iconBtn.textContent = "🔒";
        labelBtn.textContent = "Simpan & Kunci Sesi";

        areaAbsensi.classList.add('opacity-30', 'pointer-events-none');
        setStatus("Pilih cabang & olahraga lalu klik Simpan Sesi", "normal");
      }
    }

    function setStatus(pesan, tipe) {
      var box = document.getElementById('statusBox');
      var txt = document.getElementById('statusText');
      txt.textContent = pesan;

      box.className = "min-h-[44px] rounded-xl p-2.5 flex items-center justify-center text-center border ";
      if (tipe === 'success') {
        box.className += "bg-emerald-50 border-emerald-200 text-emerald-700 font-bold";
      } else if (tipe === 'error') {
        box.className += "bg-rose-50 border-rose-200 text-rose-700 font-semibold";
      } else if (tipe === 'loading') {
        box.className += "bg-amber-50 border-amber-200 text-amber-700 font-semibold";
      } else {
        box.className += "bg-gray-50 border-gray-100 text-gray-400 font-medium";
      }
    }

    function kirimAbsensi(payloadQr, kodeManual) {
      if (isProcessing) return;

      var cabang = document.getElementById('selectCabang').value;
      var olahraga = document.getElementById('selectOlahraga').value;

      if (!validasiSesi(cabang, olahraga) || !isSesiTerkunci) {
        setStatus("Simpan dan kunci sesi Cabang & Olahraga terlebih dahulu!", "error");
        return;
      }

      isProcessing = true;
      setStatus("Memvalidasi kehadiran...", "loading");

      var dataKirim = {
        action: 'catat_kehadiran',
        tokenPetugas: tokenPetugas,
        cabang: cabang.trim(),
        sesiOlahraga: olahraga.trim(),
        qrPayload: payloadQr || '',
        kodeManual: kodeManual || ''
      };

      fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dataKirim)
      })
      .then(function (res) { return res.json(); })
      .then(function (res) {
        if (res.success) {
          setStatus("✅ " + res.nama + " (" + res.olahraga + ") Berhasil Hadir!", "success");
          if (navigator.vibrate) navigator.vibrate(200);
        } else {
          setStatus("❌ " + res.message, "error");
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      })
      .catch(function (err) {
        setStatus("Gagal terhubung ke server: " + err.message, "error");
      })
      .finally(function () {
        setTimeout(function () {
          isProcessing = false;
          if (document.getElementById('statusText').textContent.indexOf('Berhasil') !== -1) {
            setStatus("Arahkan kamera ke QR Code peserta berikutnya", "normal");
          }
        }, 1500);
      });
    }

    function requestCameraAccess() {
      var cabang = document.getElementById('selectCabang').value;
      var olahraga = document.getElementById('selectOlahraga').value;

      if (!validasiSesi(cabang, olahraga) || !isSesiTerkunci) {
        alert("Pilih Cabang & Olahraga dan klik 'Simpan & Kunci Sesi' terlebih dahulu!");
        return;
      }

      var promptEl = document.getElementById('cameraPrompt');
      var overlayEl = document.getElementById('scanOverlay');
      setStatus("Meminta izin kamera...", "loading");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("Browser tidak mendukung WebRTC kamera.", "error");
        return;
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(function (stream) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          if (promptEl) promptEl.classList.add('hidden');
          if (overlayEl) overlayEl.classList.remove('hidden');
          initHtml5Scanner();
        })
        .catch(function () {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then(function (stream2) {
              stream2.getTracks().forEach(function (t) { t.stop(); });
              if (promptEl) promptEl.classList.add('hidden');
              if (overlayEl) overlayEl.classList.remove('hidden');
              initHtml5Scanner();
            })
            .catch(function () {
              setStatus("Izin kamera ditolak di pengaturan browser HP Anda.", "error");
            });
        });
    }

    function initHtml5Scanner() {
      if (!window.Html5Qrcode) {
        setStatus("Library scanner belum siap.", "error");
        return;
      }

      html5QrCode = new Html5Qrcode("reader");
      var config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        function (decodedText) { kirimAbsensi(decodedText, ''); },
        function () {}
      ).then(function () {
        setStatus("Scanner aktif. Arahkan kamera ke QR Code peserta", "normal");
      }).catch(function () {
        html5QrCode.start(
          { facingMode: "user" },
          config,
          function (decodedText) { kirimAbsensi(decodedText, ''); },
          function () {}
        ).then(function () {
          setStatus("Scanner aktif. Arahkan kamera ke QR Code peserta", "normal");
        }).catch(function (err2) {
          setStatus("Gagal memuat kamera: " + err2, "error");
        });
      });
    }

    function prosesManual() {
      var val = document.getElementById('inputManual').value.trim();
      if (!val) {
        alert("Masukkan kode manual terlebih dahulu.");
        return;
      }
      kirimAbsensi('', val);
      document.getElementById('inputManual').value = '';
    }

    document.addEventListener("DOMContentLoaded", function () {
      parseHash();
      fetchMasterDataFromAPI();
    });
  </script>
</body>
</html>
