<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SATO Sport - Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1E4D3E; }
    #reader video { border-radius: 1rem; object-fit: cover; width: 100% !important; height: 100% !important; }
    #reader { border: none !important; }
  </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between text-white pb-3 pt-2">
    <div>
      <h1 class="text-base font-bold">Scanner Petugas</h1>
      <p id="labelPetugas" class="text-[11px] text-white/70">Petugas Standby</p>
    </div>
    <a id="btnKembali" href="#" class="text-xs bg-white/10 border border-white/20 px-3 py-1.5 rounded-full text-white font-semibold active:scale-95 transition">
      ← Dashboard
    </a>
  </div>

  <!-- Scanner Container -->
  <div class="bg-white rounded-3xl p-4 shadow-xl flex flex-col gap-3">
    
    <!-- Pilih Sesi -->
    <div>
      <label class="text-[11px] font-bold text-gray-600 mb-1 block">Sesi Olahraga</label>
      <input type="text" id="inputSesi" value="Sesi Olahraga" placeholder="Contoh: Sesi 1 / Pagi"
        class="w-full px-3.5 py-2 rounded-xl border border-gray-200 bg-gray-50 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-[#1E4D3E]" />
    </div>

    <!-- Area Kamera Scanner -->
    <div class="relative w-full aspect-square bg-black rounded-2xl overflow-hidden flex items-center justify-center">
      <div id="reader" class="w-full h-full"></div>
      
      <!-- Overlay Tombol Izin Kamera -->
      <div id="cameraPrompt" class="absolute inset-0 bg-gray-900/90 flex flex-col items-center justify-center p-4 text-center z-20">
        <span class="text-3xl mb-2">📷</span>
        <p class="text-white text-xs font-semibold mb-3">Ketuk untuk mengizinkan akses kamera HP</p>
        <button onclick="requestCameraAccess()" class="bg-[#ECB140] text-[#1E4D3E] font-bold text-xs px-5 py-2.5 rounded-xl shadow-md active:scale-95 transition">
          Aktifkan Kamera
        </button>
      </div>

      <div id="scanOverlay" class="absolute inset-0 pointer-events-none border-2 border-[#ECB140] m-8 rounded-2xl opacity-60 hidden"></div>
    </div>

    <!-- Status Hasil Scan -->
    <div id="statusBox" class="min-h-[44px] bg-gray-50 border border-gray-100 rounded-xl p-2.5 flex items-center justify-center text-center">
      <p id="statusText" class="text-xs text-gray-400 font-medium">Kamera siap diaktifkan</p>
    </div>

    <!-- Input Manual Alternatif -->
    <div class="border-t border-dashed border-gray-200 pt-3 flex gap-2">
      <input type="text" id="inputManual" placeholder="Kode Manual (6 digit)"
        class="flex-1 px-3 py-2 rounded-xl border border-gray-200 bg-gray-50 text-xs font-mono font-bold focus:outline-none focus:ring-1 focus:ring-[#1E4D3E]" />
      <button onclick="prosesManual()" class="bg-[#1E4D3E] text-white px-4 py-2 rounded-xl text-xs font-bold active:scale-95 transition">
        Kirim
      </button>
    </div>

  </div>

  <p class="text-center text-white/40 text-[10px] py-2">SATO Sport &mdash; Powered On Site</p>

  <script>
    var BACKEND_URL = "https://script.google.com/macros/s/AKfycbx8WsR3GEHhImvddjnBx3GhG7GmOV1snfJELGMqY-7FjIl15G1TpvovrjsKJmm0QS3-Aw/exec";
    
    var tokenPetugas = "";
    var namaPetugas = "";
    var html5QrCode = null;
    var isProcessing = false;

    function parseHash() {
      try {
        var hash = window.location.hash.substring(1);
        document.getElementById('btnKembali').href = BACKEND_URL + '?authuser=0';
        if (!hash) return;
        var params = new URLSearchParams(hash);
        tokenPetugas = params.get('token') || '';
        namaPetugas = params.get('nama') || '';

        if (namaPetugas) {
          document.getElementById('labelPetugas').textContent = 'Petugas: ' + decodeURIComponent(namaPetugas);
        }
      } catch (e) {
        console.error("Gagal parse hash:", e);
      }
    }

    function setStatus(pesan, tipe) {
      var box = document.getElementById('statusBox');
      var txt = document.getElementById('statusText');
      txt.textContent = pesan;

      box.className = "min-h-[44px] rounded-xl p-2.5 flex items-center justify-center text-center border ";
      if (tipe === 'success') {
        box.className += "bg-emerald-50 border-emerald-200 text-emerald-700 font-bold";
      } else if (tipe === 'error') {
        box.className += "bg-rose-50 border-rose-200 text-rose-700 font-semibold";
      } else if (tipe === 'loading') {
        box.className += "bg-amber-50 border-amber-200 text-amber-700 font-semibold";
      } else {
        box.className += "bg-gray-50 border-gray-100 text-gray-400 font-medium";
      }
    }

    function kirimAbsensi(payloadQr, kodeManual) {
      if (isProcessing) return;
      isProcessing = true;
      setStatus("Memvalidasi kehadiran...", "loading");

      var sesi = document.getElementById('inputSesi').value.trim() || 'Sesi Olahraga';

      var dataKirim = {
        action: 'catat_kehadiran',
        tokenPetugas: tokenPetugas,
        sesiOlahraga: sesi,
        qrPayload: payloadQr || '',
        kodeManual: kodeManual || ''
      };

      fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dataKirim)
      })
      .then(function(res) { return res.json(); })
      .then(function(res) {
        if (res.success) {
          setStatus("✅ " + res.nama + " (" + res.olahraga + ") Berhasil Hadir!", "success");
          if (navigator.vibrate) navigator.vibrate(200);
        } else {
          setStatus("❌ " + res.message, "error");
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      })
      .catch(function(err) {
        setStatus("Gagal terhubung ke server: " + err.message, "error");
      })
      .finally(function() {
        setTimeout(function() {
          isProcessing = false;
          if (document.getElementById('statusText').textContent.indexOf('Berhasil') !== -1) {
            setTimeout(function() { setStatus("Arahkan kamera ke QR Code peserta", "normal"); }, 2500);
          }
        }, 1500);
      });
    }

    function requestCameraAccess() {
      var promptEl = document.getElementById('cameraPrompt');
      var overlayEl = document.getElementById('scanOverlay');
      setStatus("Meminta izin kamera...", "loading");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("Browser tidak mendukung WebRTC kamera.", "error");
        return;
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(function(stream) {
          stream.getTracks().forEach(function(t) { t.stop(); });
          if (promptEl) promptEl.classList.add('hidden');
          if (overlayEl) overlayEl.classList.remove('hidden');
          initHtml5Scanner();
        })
        .catch(function() {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream2) {
              stream2.getTracks().forEach(function(t) { t.stop(); });
              if (promptEl) promptEl.classList.add('hidden');
              if (overlayEl) overlayEl.classList.remove('hidden');
              initHtml5Scanner();
            })
            .catch(function() {
              setStatus("Izin kamera ditolak di browser HP Anda.", "error");
            });
        });
    }

    function initHtml5Scanner() {
      if (!window.Html5Qrcode) {
        setStatus("Library scanner belum siap.", "error");
        return;
      }

      html5QrCode = new Html5Qrcode("reader");
      var config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        function(decodedText) {
          kirimAbsensi(decodedText, '');
        },
        function() {}
      ).then(function() {
        setStatus("Arahkan kamera ke QR Code peserta", "normal");
      }).catch(function() {
        html5QrCode.start(
          { facingMode: "user" },
          config,
          function(decodedText) { kirimAbsensi(decodedText, ''); },
          function() {}
        ).then(function() {
          setStatus("Arahkan kamera ke QR Code peserta", "normal");
        }).catch(function(err2) {
          setStatus("Gagal memuat kamera: " + err2, "error");
        });
      });
    }

    function prosesManual() {
      var val = document.getElementById('inputManual').value.trim();
      if (!val) {
        alert("Masukkan kode manual terlebih dahulu.");
        return;
      }
      kirimAbsensi('', val);
      document.getElementById('inputManual').value = '';
    }

    document.addEventListener("DOMContentLoaded", function() {
      parseHash();
    });
  </script>
</body>
</html>
