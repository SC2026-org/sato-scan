  var SESSION_KEY = 'sato_scan_session';

  function simpanSession(data) { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); }
  function ambilSession() { var s = localStorage.getItem(SESSION_KEY); return s ? JSON.parse(s) : null; }
  function hapusSession() { localStorage.removeItem(SESSION_KEY); }

  function panggilGet(action, params) {
    var url = APPS_SCRIPT_URL + '?action=' + action;
    if (params) {
      Object.keys(params).forEach(function (k) { url += '&' + k + '=' + encodeURIComponent(params[k]); });
    }
    return fetch(url).then(function (r) { return r.json(); });
  }

  function panggilPost(action, data) {
    var body = Object.assign({ action: action }, data);
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  var app = document.getElementById('app');

  function renderLogin() {
    app.innerHTML =
      '<div class="min-h-screen flex flex-col bg-cream">' +
        '<div class="bg-forest px-5 pt-6 pb-14 flex items-center justify-center rounded-b-[2rem] shadow-md">' +
          '<h1 class="text-white font-bold text-lg">Scan Petugas</h1>' +
        '</div>' +
        '<div class="flex-1 px-5 -mt-9 pb-10">' +
          '<div class="bg-white rounded-3xl shadow-lg border border-gray-100 p-6">' +
            '<div class="flex flex-col items-center mb-6">' +
              '<img src="data:image/png;base64,' + LOGO_BASE64 + '" class="w-24 h-auto" alt="SATO" />' +
              '<p class="text-xs text-gray-400 mt-3">Khusus Petugas &amp; Admin</p>' +
            '</div>' +
            '<div class="flex flex-col gap-4">' +
              '<div>' +
                '<label class="text-xs font-semibold text-gray-500 mb-1 block">No HP</label>' +
                '<input type="tel" id="loginNoHP" placeholder="08xxxxxxxxxx" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-forest/40 text-sm" />' +
              '</div>' +
              '<div>' +
                '<label class="text-xs font-semibold text-gray-500 mb-1 block">PIN</label>' +
                '<input type="password" id="loginPIN" maxlength="6" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-forest/40 text-sm tracking-widest" />' +
              '</div>' +
              '<p id="loginError" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>' +
              '<button id="btnLogin" class="mt-2 w-full bg-mustard text-forest font-bold text-base py-4 rounded-2xl shadow-sm active:scale-[0.98] transition">Masuk</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('btnLogin').onclick = function () {
      var noHP = document.getElementById('loginNoHP').value.trim();
      var pin = document.getElementById('loginPIN').value.trim();
      var errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');

      if (!noHP || !pin) { errEl.textContent = 'Isi No HP dan PIN dulu.'; errEl.classList.remove('hidden'); return; }
      if (APPS_SCRIPT_URL.indexOf('PASTE_URL') !== -1) {
        errEl.textContent = 'APPS_SCRIPT_URL belum diisi di kode HTML ini.';
        errEl.classList.remove('hidden');
        return;
      }

      var btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = 'Memproses...';

      panggilPost('loginUser', { noHP: noHP, pin: pin }).then(function (hasil) {
        btn.disabled = false; btn.textContent = 'Masuk';
        if (!hasil.success) { errEl.textContent = hasil.message; errEl.classList.remove('hidden'); return; }
        simpanSession(hasil);
        renderPilihSesi();
      }).catch(function (err) {
        btn.disabled = false; btn.textContent = 'Masuk';
        errEl.textContent = 'Gagal terhubung ke server: ' + err.message;
        errEl.classList.remove('hidden');
      });
    };
  }

              '<div>' +
                '<label class="text-xs font-semibold text-gray-500 mb-1 block">Olahraga</label>' +
                '<select id="sesiOlahraga" disabled class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-100 text-gray-400 text-sm"><option value="">Pilih cabang dulu</option></select>' +
              '</div>' +
              '<button id="btnMulaiSesi" class="mt-2 w-full bg-mustard text-forest font-bold text-base py-4 rounded-2xl shadow-sm active:scale-[0.98] transition">Mulai Sesi Absen</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('btnLogout').onclick = function () { hapusSession(); renderLogin(); };

    panggilGet('daftarCabang').then(function (list) {
      var sel = document.getElementById('sesiCabang');
      sel.innerHTML = '<option value="">Pilih Cabang</option>';
      list.forEach(function (c) { sel.innerHTML += '<option value="' + c + '">' + c + '</option>'; });
    });

    document.getElementById('sesiCabang').onchange = function () {
      var cabang = this.value;
      var selO = document.getElementById('sesiOlahraga');
      if (!cabang) { selO.innerHTML = '<option value="">Pilih cabang dulu</option>'; selO.disabled = true; return; }
      selO.innerHTML = '<option value="">Memuat...</option>';
      panggilGet('olahragaByCabang', { cabang: cabang }).then(function (list) {
        selO.innerHTML = '<option value="">Pilih Olahraga</option>';
        list.forEach(function (o) { selO.innerHTML += '<option value="' + o + '">' + o + '</option>'; });
        selO.disabled = false;
        selO.className = 'w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 text-sm';
      });
    };

    document.getElementById('btnMulaiSesi').onclick = function () {
      var cabang = document.getElementById('sesiCabang').value;
      var olahraga = document.getElementById('sesiOlahraga').value;
      if (!cabang || !olahraga) { alert('Pilih Cabang dan Olahraga dulu.'); return; }
      renderScan(cabang, olahraga);
    };
  }

  var html5QrCode = null;
  var sedangProses = false;

  function renderScan(cabang, olahraga) {
    var session = ambilSession();
    app.innerHTML =
      '<div class="min-h-screen flex flex-col bg-cream">' +
        '<div class="bg-forest px-5 pt-6 pb-14 flex items-center gap-3 rounded-b-[2rem] shadow-md">' +
          '<button id="btnBack" class="text-white/90 text-xl leading-none">&#8592;</button>' +
          '<h1 class="text-white font-bold text-lg">Scan Petugas</h1>' +
        '</div>' +
        '<div class="flex-1 px-5 -mt-9 pb-10">' +
          '<div class="bg-white rounded-2xl shadow-md border border-gray-100 px-4 py-3 mb-4 flex items-center justify-between">' +
            '<div><p class="text-[10px] text-gray-400">Sesi aktif</p><p class="text-sm font-bold text-forest">' + cabang + ' &bull; ' + olahraga + '</p></div>' +
          '</div>' +
          '<div class="flex bg-white rounded-2xl p-1 mb-4 border border-gray-200 shadow-sm">' +
            '<button id="tabBtnScan" class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-forest text-white">Scan QR</button>' +
            '<button id="tabBtnManual" class="flex-1 py-2.5 rounded-xl text-sm font-semibold text-gray-400">Input Manual</button>' +
          '</div>' +
          '<div id="tabScan" class="bg-white rounded-3xl shadow-lg border border-gray-100 p-4">' +
            '<div id="qrReader" class="rounded-2xl overflow-hidden"></div>' +
            '<p class="text-center text-xs text-gray-400 mt-3">Arahkan kamera ke QR Peserta</p>' +
          '</div>' +
          '<div id="tabManual" class="hidden bg-white rounded-3xl shadow-lg border border-gray-100 p-6">' +
            '<label class="text-xs font-semibold text-gray-500 mb-1 block">Kode Manual Peserta</label>' +
            '<input type="text" id="inputKodeManual" maxlength="6" placeholder="XXXXXX" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-sm text-center tracking-[0.3em] font-mono font-bold uppercase" />' +
            '<button id="btnSubmitManual" class="mt-4 w-full bg-forest text-white font-bold text-sm py-3.5 rounded-2xl active:scale-[0.98] transition">Catat Kehadiran</button>' +
          '</div>' +
          '<div id="hasilScan" class="hidden mt-4 rounded-2xl p-4 text-sm font-semibold text-center"></div>' +
          '<p id="counterAbsen" class="text-center text-xs text-gray-400 mt-4">0 absen tercatat sesi ini</p>' +
        '</div>' +
      '</div>';

    var jumlahAbsen = 0;

    document.getElementById('btnBack').onclick = function () { hentikanKamera(); renderPilihSesi(); };

    document.getElementById('tabBtnScan').onclick = function () {
      this.className = 'flex-1 py-2.5 rounded-xl text-sm font-semibold bg-forest text-white';
      document.getElementById('tabBtnManual').className = 'flex-1 py-2.5 rounded-xl text-sm font-semibold text-gray-400';
      document.getElementById('tabScan').classList.remove('hidden');
      document.getElementById('tabManual').classList.add('hidden');
      mulaiKamera();
    };
    document.getElementById('tabBtnManual').onclick = function () {
      this.className = 'flex-1 py-2.5 rounded-xl text-sm font-semibold bg-forest text-white';
      document.getElementById('tabBtnScan').className = 'flex-1 py-2.5 rounded-xl text-sm font-semibold text-gray-400';
      document.getElementById('tabManual').classList.remove('hidden');
      document.getElementById('tabScan').classList.add('hidden');
      hentikanKamera();
    };
    document.getElementById('btnSubmitManual').onclick = function () {
      var kode = document.getElementById('inputKodeManual').value.trim().toUpperCase();
      if (!kode) { alert('Isi kode manual dulu.'); return; }
      prosesScan(kode, 'manual', olahraga, session.sessionToken);
    };

    function mulaiKamera() {
      if (html5QrCode) return;
      html5QrCode = new Html5Qrcode('qrReader');
      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 230 },
        function (decodedText) { prosesScan(decodedText, 'qr', olahraga, session.sessionToken); },
        function () {}
      ).catch(function () {
        tampilkanHasil('Gagal membuka kamera. Pastikan izin kamera diaktifkan.', false);
        html5QrCode = null;
      });
    }

    function tampilkanHasil(pesan, sukses) {
      var el = document.getElementById('hasilScan');
      el.textContent = pesan;
      el.className = 'mt-4 rounded-2xl p-4 text-sm font-semibold text-center ' + (sukses ? 'bg-green-50 text-green-700 border border-green-100' : 'bg-red-50 text-red-600 border border-red-100');
      el.classList.remove('hidden');
    }

    function prosesScan(nilai, mode, olahragaSesi, sessionToken) {
      if (sedangProses) return;
      sedangProses = true;
      panggilPost('catatKehadiran', { sessionToken: sessionToken, nilai: nilai, mode: mode, olahraga: olahragaSesi }).then(function (hasil) {
        tampilkanHasil(hasil.message, hasil.success);
        if (hasil.success) {
          jumlahAbsen++;
          document.getElementById('counterAbsen').textContent = jumlahAbsen + ' absen tercatat sesi ini';
          document.getElementById('inputKodeManual').value = '';
        }
        setTimeout(function () { sedangProses = false; }, 1800);
      }).catch(function (err) {
        tampilkanHasil('Gagal terhubung ke server: ' + err.message, false);
        setTimeout(function () { sedangProses = false; }, 1800);
      });
    }

    mulaiKamera();
  }

  function hentikanKamera() {
    if (html5QrCode) {
      html5QrCode.stop().then(function () { html5QrCode.clear(); }).catch(function () {});
      html5QrCode = null;
    }
  }
  window.addEventListener('beforeunload', hentikanKamera);

  function bacaQueryParam(nama) {
    var params = new URLSearchParams(window.location.search);
    return params.get(nama);
  }

  var tokenDariURL = bacaQueryParam('token');
  var namaDariURL = bacaQueryParam('nama');

  if (tokenDariURL) {
    // Datang dari Dashboard Apps Script (klik menu Scan Petugas) -
    // langsung pakai token itu, skip Login. Bersihin URL setelahnya
    // biar token gak nangkring di address bar/history browser.
    simpanSession({ success: true, sessionToken: tokenDariURL, nama: namaDariURL || 'Petugas' });
    window.history.replaceState({}, document.title, window.location.pathname);
    renderPilihSesi();
  } else {
    var sesiTersimpan = ambilSession();
    if (sesiTersimpan && sesiTersimpan.sessionToken) { renderPilihSesi(); } else { renderLogin(); }
  }
</script>
</body>
</html>
