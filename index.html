<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SATO Sport - Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1E4D3E; color: #1f2937; padding: 14px; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; max-width: 440px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; color: white; padding-bottom: 12px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header p { font-size: 11px; opacity: 0.75; }
    .btn-dash { font-size: 12px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); padding: 5px 12px; border-radius: 9999px; color: white; text-decoration: none; font-weight: 600; }
    .card { background: white; border-radius: 18px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 14px; }
    .field-group label { font-size: 11px; font-weight: 600; color: #6b7280; display: block; margin-bottom: 3px; }
    .select-wrap { position: relative; }
    .select-wrap select { width: 100%; appearance: none; padding: 10px 14px; border-radius: 9px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 12px; font-weight: 600; color: #374151; outline: none; }
    .select-wrap select:disabled { background: #f3f4f6; color: #9ca3af; }
    .select-wrap::after { content: "▼"; font-size: 9px; color: #9ca3af; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .btn-sesi { width: 100%; background: #ECB140; color: #1E4D3E; font-weight: 700; font-size: 13px; padding: 11px; border-radius: 12px; border: none; cursor: pointer; transition: 0.15s; }
    .btn-sesi.locked { background: white; color: #1E4D3E; border: 1.5px solid #1E4D3E; }
    .btn-sesi:active { transform: scale(0.98); }
    .area-scan { display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed #e5e7eb; padding-top: 12px; transition: 0.2s; }
    .area-scan.locked { opacity: 0.35; pointer-events: none; }
    .reader-box { position: relative; width: 100%; aspect-ratio: 1/1; background: black; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #reader { width: 100% !important; height: 100% !important; border: none !important; }
    #reader video { border-radius: 14px; object-fit: cover; width: 100% !important; height: 100% !important; }
    .camera-prompt { position: absolute; inset: 0; background: rgba(17,24,39,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; z-index: 20; }
    .btn-kamera { background: #ECB140; color: #1E4D3E; font-weight: 700; font-size: 13px; padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer; }
    .status-box { min-height: 44px; background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; font-weight: 500; color: #6b7280; }
    .status-box.success { background: #ecfdf5; border-color: #a7f3d0; color: #047857; font-weight: 700; }
    .status-box.error { background: #fff1f2; border-color: #fecdd3; color: #be123c; font-weight: 600; }
    .status-box.loading { background: #fffbeb; border-color: #fde68a; color: #b45309; font-weight: 600; }
    .manual-box { display: flex; gap: 8px; }
    .manual-box input { flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 13px; font-family: monospace; font-weight: 700; outline: none; }
    .manual-box button { background: #1E4D3E; color: white; padding: 9px 18px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
    .footer { text-align: center; color: rgba(255,255,255,0.4); font-size: 11px; padding: 10px 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div>
      <h1>Scanner Petugas</h1>
      <p id="labelPetugas">Petugas Standby</p>
    </div>
    <a id="btnKembali" href="https://script.google.com/macros/s/AKfycbyOwR22_3brncTkrJcrGwxufbmlXg4QfScFP2n-QefL_umC38H5PmqAfgRnzjxBy3yP1g/exec" class="btn-dash">
      ← Dashboard
    </a>
  </div>

  <!-- Form Card -->
  <div class="card">
    
    <div class="field-group">
      <label>Cabang</label>
      <div class="select-wrap">
        <select id="selectCabang" onchange="onCabangChange()">
          <option value="">Pilih Cabang</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label>Olahraga</label>
      <div class="select-wrap">
        <select id="selectOlahraga" disabled>
          <option value="">Pilih cabang dulu</option>
        </select>
      </div>
    </div>

    <button type="button" id="btnSimpanSesi" onclick="handleTombolSesi()" class="btn-sesi">
      🔒 Simpan &amp; Kunci Sesi
    </button>

    <!-- Area Scanner & Input Manual -->
    <div id="areaAbsensi" class="area-scan locked">
      
      <div class="reader-box">
        <div id="reader"></div>
        <div id="cameraPrompt" class="camera-prompt">
          <span style="font-size: 28px; margin-bottom: 6px;">📷</span>
          <p style="color: white; font-size: 12px; margin-bottom: 12px;">Ketuk untuk mengaktifkan kamera scanner</p>
          <button id="btnAktifkanKamera" onclick="requestCameraAccess()" class="btn-kamera">
            Aktifkan Kamera
          </button>
        </div>
      </div>

      <div id="statusBox" class="status-box">
        <p id="statusText">Pilih cabang & olahraga lalu klik Simpan Sesi</p>
      </div>

      <div class="manual-box">
        <input type="text" id="inputManual" placeholder="Kode Manual (6 digit)" />
        <button onclick="prosesManual()">Kirim</button>
      </div>

    </div>

  </div>

  <p class="footer">SATO Sport &mdash; Powered On Site</p>

  <script>
    var BACKEND_URL = "https://script.google.com/macros/s/AKfycbyOwR22_3brncTkrJcrGwxufbmlXg4QfScFP2n-QefL_umC38H5PmqAfgRnzjxBy3yP1g/exec";

    var MASTER_DATA = {
      "Jakarta": ["Futsal", "Badminton", "Yoga"],
      "Surabaya": ["Futsal", "Voli"],
      "Bandung": ["Futsal", "Badminton"]
    };

    var tokenPetugas = "";
    var namaPetugas = "";
    var html5QrCode = null;
    var isProcessing = false;
    var isSesiTerkunci = false;

    function parseHash() {
      try {
        var hash = window.location.hash.substring(1);
        var btnBack = document.getElementById('btnKembali');
        if (btnBack) btnBack.href = BACKEND_URL;

        if (!hash) return;
        var params = new URLSearchParams(hash);
        tokenPetugas = params.get('token') || '';
        namaPetugas = params.get('nama') || '';

        if (namaPetugas) {
          document.getElementById('labelPetugas').textContent = 'Petugas: ' + decodeURIComponent(namaPetugas);
        }
      } catch (e) {}
    }

    function initDropdownData() {
      var selCabang = document.getElementById('selectCabang');
      selCabang.innerHTML = '<option value="">Pilih Cabang</option>';

      Object.keys(MASTER_DATA).forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        selCabang.appendChild(opt);
      });

      var savedCabang = (localStorage.getItem('sato_scan_cabang') || '').trim();
      var savedOlahraga = (localStorage.getItem('sato_scan_olahraga') || '').trim();

      if (savedCabang && MASTER_DATA[savedCabang]) {
        selCabang.value = savedCabang;
        renderOlahraga(savedCabang, savedOlahraga, true);
      }
    }

    function onCabangChange() {
      var cabang = (document.getElementById('selectCabang').value || '').trim();
      renderOlahraga(cabang, null, false);
    }

    function renderOlahraga(cabang, autoSelectOlahraga, isAutoLock) {
      var selOlahraga = document.getElementById('selectOlahraga');
      if (!cabang || !MASTER_DATA[cabang]) {
        selOlahraga.disabled = true;
        selOlahraga.innerHTML = '<option value="">Pilih cabang dulu</option>';
        return;
      }

      var list = MASTER_DATA[cabang];
      selOlahraga.innerHTML = '<option value="">Pilih Olahraga</option>';

      list.forEach(function(o) {
        var opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        selOlahraga.appendChild(opt);
      });

      selOlahraga.disabled = false;

      if (autoSelectOlahraga && list.indexOf(autoSelectOlahraga) !== -1) {
        selOlahraga.value = autoSelectOlahraga;
        if (isAutoLock) kunciSesiUI(true);
      }
    }

    function validasiSesi(c, o) {
      var valC = String(c || '').trim().toLowerCase();
      var valO = String(o || '').trim().toLowerCase();
      if (!valC || valC.indexOf('pilih') !== -1) return false;
      if (!valO || valO.indexOf('pilih') !== -1) return false;
      return true;
    }

    function handleTombolSesi() {
      if (!isSesiTerkunci) {
        var c = document.getElementById('selectCabang').value;
        var o = document.getElementById('selectOlahraga').value;

        if (!validasiSesi(c, o)) {
          alert("Pilih Cabang dan Olahraga yang valid terlebih dahulu!");
          return;
        }

        localStorage.setItem('sato_scan_cabang', c.trim());
        localStorage.setItem('sato_scan_olahraga', o.trim());
        kunciSesiUI(true);
      } else {
        kunciSesiUI(false);
      }
    }

    function kunciSesiUI(lock) {
      var selCabang = document.getElementById('selectCabang');
      var selOlahraga = document.getElementById('selectOlahraga');
      var btn = document.getElementById('btnSimpanSesi');
      var areaAbsensi = document.getElementById('areaAbsensi');

      if (lock) {
        if (!validasiSesi(selCabang.value, selOlahraga.value)) {
          kunciSesiUI(false);
          return;
        }

        isSesiTerkunci = true;
        selCabang.disabled = true;
        selOlahraga.disabled = true;

        btn.className = "btn-sesi locked";
        btn.textContent = "✏️ Ubah Sesi Olahraga";

        areaAbsensi.classList.remove('locked');
        setStatus("Sesi aktif: " + selCabang.value + " (" + selOlahraga.value + ")", "normal");
      } else {
        isSesiTerkunci = false;
        selCabang.disabled = false;
        selOlahraga.disabled = false;

        btn.className = "btn-sesi";
        btn.textContent = "🔒 Simpan & Kunci Sesi";

        areaAbsensi.classList.add('locked');
        setStatus("Pilih cabang & olahraga lalu klik Simpan Sesi", "normal");
      }
    }

    function setStatus(pesan, tipe) {
      var box = document.getElementById('statusBox');
      var txt = document.getElementById('statusText');
      txt.textContent = pesan;

      box.className = "status-box " + (tipe || 'normal');
    }

    function kirimAbsensi(payloadQr, kodeManual) {
      if (isProcessing) return;

      var cabang = document.getElementById('selectCabang').value;
      var olahraga = document.getElementById('selectOlahraga').value;

      if (!validasiSesi(cabang, olahraga) || !isSesiTerkunci) {
        setStatus("Pilih dan kunci sesi terlebih dahulu!", "error");
        return;
      }

      isProcessing = true;
      setStatus("Memvalidasi kehadiran...", "loading");

      var dataKirim = {
        action: 'catat_kehadiran',
        tokenPetugas: tokenPetugas,
        cabang: cabang.trim(),
        sesiOlahraga: olahraga.trim(),
        qrPayload: payloadQr || '',
        kodeManual: kodeManual || ''
      };

      fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dataKirim)
      })
      .then(function(res) { return res.json(); })
      .then(function(res) {
        if (res.success) {
          setStatus("✅ " + res.nama + " (" + res.olahraga + ") Berhasil Hadir!", "success");
          if (navigator.vibrate) navigator.vibrate(200);
        } else {
          setStatus("❌ " + res.message, "error");
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      })
      .catch(function(err) {
        setStatus("Gagal terhubung ke server: " + err.message, "error");
      })
      .finally(function() {
        setTimeout(function() {
          isProcessing = false;
          if (document.getElementById('statusText').textContent.indexOf('Berhasil') !== -1) {
            setStatus("Arahkan kamera ke QR Code berikutnya", "normal");
          }
        }, 1500);
      });
    }

    function requestCameraAccess() {
      var promptEl = document.getElementById('cameraPrompt');
      setStatus("Meminta izin kamera...", "loading");

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("Browser tidak mendukung kamera.", "error");
        return;
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(function(stream) {
          stream.getTracks().forEach(function(t) { t.stop(); });
          if (promptEl) promptEl.style.display = 'none';
          initHtml5Scanner();
        })
        .catch(function() {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream2) {
              stream2.getTracks().forEach(function(t) { t.stop(); });
              if (promptEl) promptEl.style.display = 'none';
              initHtml5Scanner();
            })
            .catch(function() {
              setStatus("Izin kamera ditolak di pengaturan browser HP.", "error");
            });
        });
    }

    function initHtml5Scanner() {
      if (!window.Html5Qrcode) {
        setStatus("Library scanner belum siap.", "error");
        return;
      }

      html5QrCode = new Html5Qrcode("reader");
      var config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        function(decodedText) { kirimAbsensi(decodedText, ''); },
        function() {}
      ).then(function() {
        setStatus("Scanner aktif. Arahkan kamera ke QR Code peserta", "normal");
      }).catch(function() {
        html5QrCode.start(
          { facingMode: "user" },
          config,
          function(decodedText) { kirimAbsensi(decodedText, ''); },
          function() {}
        ).then(function() {
          setStatus("Scanner aktif. Arahkan kamera ke QR Code peserta", "normal");
        }).catch(function(err2) {
          setStatus("Gagal memuat kamera: " + err2, "error");
        });
      });
    }

    function prosesManual() {
      var val = document.getElementById('inputManual').value.trim();
      if (!val) {
        alert("Masukkan kode manual terlebih dahulu.");
        return;
      }
      kirimAbsensi('', val);
      document.getElementById('inputManual').value = '';
    }

    document.addEventListener("DOMContentLoaded", function() {
      parseHash();
      initDropdownData();
    });
  </script>
</body>
</html>
